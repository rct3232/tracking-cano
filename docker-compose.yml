services:
  tracking-cano:
    image: tracking-cano
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracking-cano
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./output:/app/output
    command: ["python", "main.py", "--live", "--config", "config/spaces.yaml", "-v"]
    restart: unless-stopped
