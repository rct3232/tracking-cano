services:
  tracking-cano:
    image: tracking-cano-gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: tracking-cano-gpu
    env_file:
      - .env
    environment:
      - RTSP_URL=${RTSP_URL}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    command: ["python", "main.py", "--live"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
