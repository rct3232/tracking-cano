services:
  tracking-cano:
    image: tracking-cano-gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: tracking-cano-gpu
    env_file:
      - .env
    environment: {}
    volumes:
      - ./configuration.yaml:/app/configuration.yaml:ro
      - ./logs:/app/logs
      - ./output:/app/output
    command: ["python", "main.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
